
name: Java Build

on: [push]

jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
            - uses: actions/checkout@v2

            # Gradle available on PATH for commits without a complete wrapper
            # (8.x still runs on Java 8; Gradle 9 requires Java 17)
            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                gradle-version: 8.14.3

            # Try building with Java 8
            - name: Set up JDK 8
              id: setupJava8
              uses: actions/setup-java@v1
              with:
                java-version: 8
    
            - name: Build with Java 8
              id: buildJava8
              run: if [ -f gradle/wrapper/gradle-wrapper.jar ]; then chmod +x ./gradlew && ./gradlew assemble testClasses; else gradle assemble testClasses; fi
              continue-on-error: true

            # If Java 8 fails, try Java 11
            - name: Set up JDK 11
              if: steps.buildJava8.outcome == 'failure'
              id: setupJava11
              uses: actions/setup-java@v1
              with:
                java-version: 11
    
            - name: Build with Java 11
              if: steps.buildJava8.outcome == 'failure'
              id: buildJava11
              run: if [ -f gradle/wrapper/gradle-wrapper.jar ]; then chmod +x ./gradlew && ./gradlew assemble testClasses; else gradle assemble testClasses; fi
              continue-on-error: true
            
            # If Java 8 AND Java 11 both fail, try Java 17
            - name: Set up JDK 17
              if: steps.buildJava8.outcome == 'failure' && steps.buildJava11.outcome == 'failure'
              id: setupJava17
              uses: actions/setup-java@v1
              with:
                java-version: 17
    
            - name: Build with Java 17
              if: steps.buildJava8.outcome == 'failure' && steps.buildJava11.outcome == 'failure'
              id: buildJava17
              run: if [ -f gradle/wrapper/gradle-wrapper.jar ]; then chmod +x ./gradlew && ./gradlew assemble testClasses; else gradle assemble testClasses; fi

            - name: Generate tar
              run: |
                mkdir MiningBuild
                find . -name '*.jar' -exec cp {} . \;
                tar -zcvf result.tar.gz *.jar
            - name: Create release
              id: create_release
              uses: actions/create-release@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                tag_name: build-342db9098da4ec3a84bd3cc9f5a3a093c0410ab2
                release_name: fetchjar-342db9098da4ec3a84bd3cc9f5a3a093c0410ab2
                draft: false
            - name: Upload jar
              id: upload-release-jar
              uses: actions/upload-release-asset@v1
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                upload_url: ${{ steps.create_release.outputs.upload_url }}
                asset_path: ./result.tar.gz
                asset_name: result.tar.gz
                asset_content_type: application/gzip
